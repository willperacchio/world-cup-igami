name: Refresh live World Cup data

on:
  schedule:
    # OFF-SEASON MODE (2026 men's tournament complete) — see REACTIVATION.md
    # for the full 2027 checklist. Daily keepalive; the fetch itself is a
    # no-op while DATA_FREEZE is active.
    - cron: "7 4 * * *"
    # 2027 Women's World Cup auto-wake (Brazil, June 24 – July 25, 2027):
    # every 30 minutes inside the tournament window. DATA_FREEZE auto-expires
    # at kickoff (scripts/fetch-live-matches.ts), so these go live on day one
    # without touching settings. For match-minute latency, also re-enable the
    # cron-job.org workflow_dispatch job (GitHub's scheduler throttles).
    - cron: "7,37 * 24-30 6 *"
    - cron: "7,37 * 1-25 7 *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this manually?"
        required: false
        default: "manual refresh"

# Never run two refreshes at once — overlapping runs could both see the same
# untweeted match and double-post it. Queue instead of cancelling so a tweet
# in flight is never killed mid-run.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Need write access to commit data updates back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch live matches from football-data.org
        env:
          FOOTBALL_ORG_AUTH_TOKEN: ${{ secrets.FOOTBALL_ORG_AUTH_TOKEN }}
          # Flip this in repo Settings → Variables to pause updates without
          # disabling the cron (e.g. if the API misbehaves mid-tournament).
          DATA_FREEZE: ${{ vars.DATA_FREEZE }}
        run: npx tsx scripts/fetch-live-matches.ts

      # Best-effort: refresh 2026 venue lookup from FIFA's API so knockout
      # venues fill in as the bracket sets. A FIFA outage must not break the
      # pipeline — the committed venues file from the last good run still works.
      - name: Refresh 2026 venue lookup from FIFA
        continue-on-error: true
        run: npx tsx scripts/build-venues.ts

      - name: Rebuild matches.json / scorigami.json / summary.json
        run: npx tsx scripts/process-data.ts

      - name: Tweet new match results
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: npx tsx scripts/post-match-tweet.ts

      - name: Commit data updates if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-matches.json data/matches.json data/scorigami.json data/summary.json
          git add data/tweeted-matches.json data/venues-2026.json data/womens 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
          else
            # Try to pull the latest scoreline out of live-matches.json for a
            # useful commit message; fall back to a generic refresh message.
            LATEST=$(node -e "
              try {
                const d = require('./data/live-matches.json');
                const last = d.matches[d.matches.length - 1];
                if (last) {
                  console.log(\`\${last.homeTeam} \${last.homeScore}-\${last.awayScore} \${last.awayTeam} (\${last.stage})\`);
                }
              } catch {}
            ")
            if [ -n "$LATEST" ]; then
              git commit -m "chore(data): refresh — latest: $LATEST"
            else
              git commit -m "chore(data): refresh live World Cup data"
            fi
            # If anything else landed on main since checkout (translate
            # workflow, manual push), a plain push fails and this run's
            # tweeted-matches.json update is lost — the next run would then
            # re-tweet the same matches. Rebase and retry instead.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push failed (attempt $attempt) — rebasing onto latest main and retrying..."
              # -X theirs: in a rebase this favors OUR replayed commit, so if
              # another run pushed its own generated data files in between,
              # this run's freshly fetched versions win instead of conflicting.
              git pull --rebase -X theirs origin main
              if [ "$attempt" = "3" ]; then
                echo "Giving up after 3 attempts."
                exit 1
              fi
            done
          fi

      # GitHub auto-disables scheduled workflows after ~60 days without repo
      # activity. During the off-season freeze no data commits happen, so push
      # an empty keepalive commit whenever the repo has been quiet 45+ days.
      # This keeps the daily run, the 2027 auto-wake crons above, and the
      # reactivation-reminder workflow alive through the dormancy.
      - name: Keepalive commit if repo has been idle 45+ days
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          IDLE_DAYS=$(( (NOW - LAST) / 86400 ))
          if [ "$IDLE_DAYS" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: off-season keepalive (repo idle ${IDLE_DAYS}d) — keeps scheduled workflows enabled"
            git push
          else
            echo "Repo active ${IDLE_DAYS}d ago — no keepalive needed."
          fi
