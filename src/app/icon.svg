<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#18181b"/>
  <!-- Mini scorigami triangle (top-left) -->
  <rect x="2" y="2" width="5" height="5" rx="1" fill="#93c5fd"/>
  <rect x="8" y="2" width="5" height="5" rx="1" fill="#3b82f6"/>
  <rect x="14" y="2" width="5" height="5" rx="1" fill="#f97316"/>
  <rect x="8" y="8" width="5" height="5" rx="1" fill="#f59e0b"/>
  <rect x="14" y="8" width="5" height="5" rx="1" fill="#27272a"/>
  <rect x="14" y="14" width="5" height="5" rx="1" fill="#27272a"/>
  <!-- Grey lower triangle -->
  <rect x="2" y="8" width="5" height="5" rx="1" fill="#27272a" opacity="0.3"/>
  <rect x="2" y="14" width="5" height="5" rx="1" fill="#27272a" opacity="0.3"/>
  <rect x="8" y="14" width="5" height="5" rx="1" fill="#27272a" opacity="0.3"/>
  <!-- Soccer ball (bottom-right) -->
  <circle cx="24" cy="24" r="6.5" fill="white" stroke="#a1a1aa" stroke-width="0.5"/>
  <!-- Center pentagon -->
  <polygon points="24,20.5 26.4,22 25.5,24.7 22.5,24.7 21.6,22" fill="#18181b"/>
  <!-- Top seam lines from pentagon -->
  <line x1="24" y1="20.5" x2="24" y2="17.5" stroke="#a1a1aa" stroke-width="0.6"/>
  <line x1="26.4" y1="22" x2="29.5" y2="20.5" stroke="#a1a1aa" stroke-width="0.6"/>
  <line x1="25.5" y1="24.7" x2="28" y2="27.5" stroke="#a1a1aa" stroke-width="0.6"/>
  <line x1="22.5" y1="24.7" x2="20" y2="27.5" stroke="#a1a1aa" stroke-width="0.6"/>
  <line x1="21.6" y1="22" x2="18.5" y2="20.5" stroke="#a1a1aa" stroke-width="0.6"/>
</svg>
